[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celica-suspension-analysis"
version = "1.0.0"
description = "Suspension data acquisition and analysis system for Toyota Celica (5th gen)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Celica Suspension Project"}
]
keywords = [
    "suspension",
    "automotive",
    "data-acquisition",
    "raspberry-pi",
    "vehicle-dynamics",
    "toyota-celica"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "plotly>=5.3.0",
    "flask>=2.0.0",
    "flask-socketio>=5.1.0",
    "pyyaml>=5.4.0",
    "python-dateutil>=2.8.0",
    "filterpy>=1.4.0",
    "pynmea2>=1.18.0"
]

[project.optional-dependencies]
hardware = [
    "smbus2>=0.4.0",
    "RPi.GPIO>=0.7.0",
    "pyserial>=3.5",
    "obd>=0.7.1"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "flake8>=4.0.0",
    "black>=22.0.0",
    "mypy>=0.930"
]

[project.scripts]
celica-daq = "src.main:main"

[project.urls]
Homepage = "https://github.com/zmohammed5/celica_suspension_analysis"
Documentation = "https://github.com/zmohammed5/celica_suspension_analysis#readme"
Repository = "https://github.com/zmohammed5/celica_suspension_analysis.git"
Issues = "https://github.com/zmohammed5/celica_suspension_analysis/issues"

[tool.setuptools]
packages = ["src", "src.sensors", "src.analysis", "src.utils", "src.dashboard"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
